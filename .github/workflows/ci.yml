name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, server and end-to-end tests
        run: npm test
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Install the browser for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:browser
